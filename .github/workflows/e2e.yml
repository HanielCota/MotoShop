name: E2E (Playwright)

# Nightly and on demand only: browser tests are slow and need an isolated Neon branch.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright against an isolated database
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_DIRECT_URL: ${{ secrets.TEST_DATABASE_DIRECT_URL }}
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-with-32-characters
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Skip when the test database is not configured
        if: env.TEST_DATABASE_URL == ''
        run: echo "::notice::TEST_DATABASE_URL secret not set; E2E skipped."
      - if: env.TEST_DATABASE_URL != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.TEST_DATABASE_URL != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: env.TEST_DATABASE_URL != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.TEST_DATABASE_URL != ''
        run: pnpm install --frozen-lockfile
      - if: env.TEST_DATABASE_URL != ''
        run: pnpm db:generate
      - name: Apply migrations to the test branch
        if: env.TEST_DATABASE_URL != ''
        run: pnpm db:deploy
        env:
          DIRECT_URL: ${{ env.TEST_DATABASE_DIRECT_URL || env.TEST_DATABASE_URL }}
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - if: env.TEST_DATABASE_URL != ''
        run: pnpm exec playwright install --with-deps chromium
      - if: env.TEST_DATABASE_URL != ''
        run: pnpm test:e2e
        env:
          CI: "true"
      - if: failure() && env.TEST_DATABASE_URL != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
