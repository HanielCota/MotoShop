name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build-time placeholders only: `next build` never connects to a database (the sitemap renders per
# request) and no real integration credential is ever needed here.
env:
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
  DIRECT_URL: postgresql://ci:ci@127.0.0.1:1/ci
  BETTER_AUTH_SECRET: ci-only-placeholder-secret-with-32-characters
  BETTER_AUTH_URL: http://localhost:3000
  ADMIN_EMAILS: ci@example.test
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, lint, format, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests (isolated Neon branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    # Never runs against production data: TEST_DATABASE_URL must point to a disposable Neon branch.
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_DIRECT_URL: ${{ secrets.TEST_DATABASE_DIRECT_URL }}
    steps:
      - name: Skip when the test database is not configured
        if: env.TEST_DATABASE_URL == ''
        run: echo "::notice::TEST_DATABASE_URL secret not set; integration tests skipped."
      - if: env.TEST_DATABASE_URL != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.TEST_DATABASE_URL != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: env.TEST_DATABASE_URL != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.TEST_DATABASE_URL != ''
        run: pnpm install --frozen-lockfile
      - if: env.TEST_DATABASE_URL != ''
        run: pnpm db:generate
      - name: Apply migrations to the test branch
        if: env.TEST_DATABASE_URL != ''
        run: pnpm db:deploy
        env:
          DIRECT_URL: ${{ env.TEST_DATABASE_DIRECT_URL || env.TEST_DATABASE_URL }}
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - if: env.TEST_DATABASE_URL != ''
        run: pnpm test:integration
        env:
          # The application modules require DATABASE_URL; in CI it is the same disposable test branch.
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          ALLOW_SHARED_TEST_DATABASE: "true"
