allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: false
# Minutes a release must age before pnpm installs it (pnpm default, declared so it cannot drift).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - deepmerge-ts@8.0.0
  - mysql2@3.22.0 || 3.23.1
  - fast-uri@3.1.8
  - ip-address@10.7.1
  - brace-expansion@1.1.19 || 1.1.20 || 1.1.21 || 2.1.5 || 2.1.6 || 2.1.7 || 5.0.10 || 5.0.11 || 5.0.12
  - "@grpc/grpc-js@1.14.5"
overrides:
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  deepmerge-ts@<8.0.0: ^8.0.0
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  mysql2@<3.23.1: ^3.23.1
  # GHSA-jqcg-44mw-7w3h (pulled through express by shadcn's MCP SDK and inngest's peer).
  proxy-addr@<2.0.8: ^2.0.8
  # GHSA-68fv-2mgg-jv7q (build-time, via Tailwind/PostCSS).
  source-map-js@<1.2.2: ^1.2.2
